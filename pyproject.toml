[project]
name = "vocabcatcher"
version = "0.1.0"
description = "VocabCatcher - CEFR-targeted vocabulary extractor with Gemini LLM pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "google-genai>=0.1.1",
    "pypandoc>=1.13",
    "youtube-transcript-api>=0.6.2",
    "python-multipart>=0.0.9",
    "genanki>=0.13.1",
    "aiofiles>=24.1.0",
    "pypdf>=6.19.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

